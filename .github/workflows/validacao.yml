name: Validação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: compara_preco
          POSTGRES_USER: compara_preco
          POSTGRES_PASSWORD: senha-exclusiva-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U compara_preco -d compara_preco"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/compara_preco
      DB_PASSWORD: senha-exclusiva-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: sh mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
