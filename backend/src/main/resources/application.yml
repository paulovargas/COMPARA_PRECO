spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: compara-preco-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/${POSTGRES_DB:compara_preco}}
    username: ${DB_USERNAME:${POSTGRES_USER:compara_preco}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: compara_preco
  flyway:
    enabled: true
    default-schema: compara_preco
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: compara_preco.spring_session
  jackson:
    deserialization:
      accept-float-as-int: false
    time-zone: America/Sao_Paulo

server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

app:
  seguranca:
    limite-login-ip: 30
    limite-login-email: 10
    limite-cadastro-ip: 10
  admin-inicial:
    habilitado: ${APP_ADMIN_HABILITADO:false}
    nome: ${APP_ADMIN_NOME:Administrador}
    email: ${APP_ADMIN_EMAIL:}
    senha: ${APP_ADMIN_SENHA:}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
