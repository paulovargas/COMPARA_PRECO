spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: compara-preco-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/${POSTGRES_DB:compara_preco}}
    username: ${DB_USERNAME:${POSTGRES_USER:compara_preco}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: compara_preco
  flyway:
    enabled: true
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
